<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moved to home</title>
<noscript><meta http-equiv="refresh" content="0;url=https://home.mapsofmaking.org/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f4e8; color: #1c1b17; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 30rem; padding: 0 1rem; }
  a { color: #0b4f8a; }
</style>
</head>
<body>
<main>
  <h1>Moved to home</h1>
  <p>The space composer lives at <a href="https://home.mapsofmaking.org/">home.mapsofmaking.org</a> now. Taking you there; anything you had started comes with you.</p>
</main>
<script>
/*
 * genjson is retired (Story 14.8). localStorage is per origin, so home cannot
 * read the draft saved here: it travels in the URL fragment (never sent to a
 * server) as #from-genjson=<base64url(JSON)>, and home takes it once.
 * The draft is left in place here until the transition ends.
 */
(function () {
  var HOME = "https://home.mapsofmaking.org/";
  var FIELDS = ["space", "address", "city", "country_code", "description", "contact_email", "contact_matrix", "url", "logo"];
  var hash = "";
  try {
    var saved = JSON.parse(localStorage.getItem("genjson_draft") || "null");
    if (saved && typeof saved === "object") {
      var out = {};
      FIELDS.forEach(function (k) { if (typeof saved[k] === "string" && saved[k].trim()) out[k] = saved[k]; });
      if (Object.keys(out).length) {
        var bytes = new TextEncoder().encode(JSON.stringify(out));
        var bin = "";
        bytes.forEach(function (b) { bin += String.fromCharCode(b); });
        hash = "#from-genjson=" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
    }
  } catch (e) { /* no storage or a damaged draft: go without it */ }
  location.replace(HOME + location.search + hash);
})();
</script>
</body>
</html>
