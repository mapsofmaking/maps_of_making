name: maps-web

on:
  pull_request:
    paths:
      - "web/**"
      - "infra/web/**"
      - ".dockerignore"
      - ".github/workflows/web.yml"
  push:
    branches: [mom-vps]
    paths:
      - "web/**"
      - "infra/web/**"
      - ".dockerignore"
      - ".github/workflows/web.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build maps-web and check its routes
        run: sh infra/web/smoke-test.sh
