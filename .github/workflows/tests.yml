# The Python test suites, one job per code root: each root imports its
# modules as top-level names (link_handler's `main`, harness's `bernard`, …),
# so they run as separate pytest sessions. Tests that need a live Oxigraph,
# the network or the full stack are deselected by marker.
name: tests

on:
  pull_request:
  push:
    branches: [mom-vps]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: tests, dir: ., args: tests, path: "infra/link_handler:scripts:." }
          - { name: link_handler, dir: infra/link_handler, args: ., path: "../../scripts" }
          - { name: bot, dir: infra/bot, args: ., path: "../link_handler" }
          - { name: harness, dir: harness, args: tests, path: "." }
          - { name: scripts, dir: ., args: scripts, path: "scripts" }
    name: pytest (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            infra/link_handler/requirements.txt
            harness/requirements.txt
      - name: install
        run: |
          pip install -r infra/link_handler/requirements.txt -r harness/requirements.txt
          pip install pytest pytest-asyncio pytest-httpserver
      - name: pytest
        working-directory: ${{ matrix.suite.dir }}
        env:
          PYTHONPATH: ${{ matrix.suite.path }}
        run: >
          python -m pytest ${{ matrix.suite.args }} -q
          -m "not legacy and not network and not live_integration and not live"
