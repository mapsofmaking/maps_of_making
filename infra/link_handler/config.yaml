endpoint_health:
  unresponsive_minutes_threshold: 10
  warning_minutes_threshold: 30
  broken_minutes_threshold: 60

# Widened for the demo (was 30/90/180): seeded SpaceAPI listings rarely change
# content, so Axis B aged them to zombie despite live endpoints. Mirror in web/app.js.
operational_state:
  aging_days_threshold: 180
  zombie_days_threshold: 365
  dead_days_threshold: 730

bandwidth:
  heartbeat_interval_seconds: 600
  heartbeat_timeout_seconds: 60
  # How many spaces to fetch concurrently per cycle. The cycle is network-bound;
  # parallel fetches cut a multi-minute sequential sweep to seconds. Bounded so we
  # don't open hundreds of sockets or overwhelm Oxigraph / the heartbeat sqlite.
  heartbeat_concurrency: 24
  heartbeat_log_path: "/app/tasks/heartbeat_log.db"
  gap_log_path: "/app/tasks/gap_log.txt"

activity_map_path: "/app/scripts/activity_map.yaml"

closure:
  closed_cycles_threshold: 6
