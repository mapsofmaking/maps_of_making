# =============================================================================
# SERVICE: Matrix homeserver address (Dendrite)
# DOMAIN: matrix.mapsofmaking.org
# PURPOSE: TLS termination + reverse proxy to maps-dendrite. The apex
#          (mapsofmaking.org) delegates Matrix here through /.well-known/matrix/*,
#          so the apex can move to another server while Dendrite stays.
# ADDED: 2026-11-01 (map migration, move 1)
# SSL: Let's Encrypt — certbot certonly --webroot -w /var/www/certbot
#        -d matrix.mapsofmaking.org
#      The 443 block needs the certificate to exist: install the port-80 block
#      first, run certbot, then add the 443 block (nginx -t fails without it).
# DNS: A record matrix.mapsofmaking.org → Hetzner (done 2026-10-31)
# BACKEND: maps-dendrite:8008 (same as the /_matrix/ location of 06-)
# KEEP: this file stays after the rest of 06–09 is removed (docs: "After").
# =============================================================================

server {
    listen      80;
    listen [::]:80;
    server_name matrix.mapsofmaking.org;

    access_log /var/log/nginx/matrix_http_access.log combined;
    error_log  /var/log/nginx/matrix_error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name matrix.mapsofmaking.org;

    http2 on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/matrix.mapsofmaking.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.mapsofmaking.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/matrix_https_access.log combined;
    error_log  /var/log/nginx/matrix_error.log;

    # Client + federation API
    location /_matrix/ {
        set $upstream http://maps-dendrite:8008;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / { return 404; }
}
