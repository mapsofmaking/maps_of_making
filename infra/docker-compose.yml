name: maps_of_making

# Images: CI (.github/workflows/images.yml) builds maps-web, maps-link-handler
# and maps-agent-bot on every push to mom-vps and pushes them to GHCR as
# sha-<commit> and mom-vps. A server pulls the tag in MAP_TAG and never
# builds:  docker compose pull && docker compose up -d --no-build
# Locally, MAP_TAG is unset: `up --build` builds and tags them `local`.

services:

  # ─────────────────────────────────────────────────────────────────
  # maps-web — the app's web server (Caddy, infra/web/Caddyfile).
  # Serves web/ (baked into the image), routes /api, /claim, /sparql and
  # the admin login, and maps admin./genjson./mothersands. hosts to their
  # sections. Joins the gateway network: the host's gateway sends every
  # Maps of Making hostname here, unchanged, and does TLS.
  # ─────────────────────────────────────────────────────────────────
  maps-web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    image: ghcr.io/mapsofmaking/maps-web:${MAP_TAG:-local}
    container_name: maps-web
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - gateway
      - internal
    volumes:
      - ../web/data:/srv/data:ro
      - ../web/canary:/srv/canary:ro
    environment:
      # Admin login. Hash from `caddy hash-password`; unset, maps-web will not
      # start (no admin area without a password).
      - MAP_ADMIN_USER=${MAP_ADMIN_USER:-admin}
      - MAP_ADMIN_PASSWORD_HASH=${MAP_ADMIN_PASSWORD_HASH:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mak-link-handler:
        condition: service_started
      oxigraph:
        condition: service_started

  # ─────────────────────────────────────────────────────────────────
  # oxigraph — SPARQL 1.1 triplestore
  # Persists RDF data in data/oxigraph/ (bind-mounted from VPS host).
  # Internal only — access via nginx proxy on VPS.
  # ─────────────────────────────────────────────────────────────────
  oxigraph:
    # Pinned: data/oxigraph is copied raw between hosts, so the version must match.
    image: ghcr.io/oxigraph/oxigraph:0.5.7
    container_name: maps-oxigraph
    restart: unless-stopped
    mem_limit: 768m
    networks:
      - internal
    volumes:
      - ../data/oxigraph:/data
    expose:
      - "7878"
    command: serve --location /data --bind 0.0.0.0:7878

  # ─────────────────────────────────────────────────────────────────
  # Profile `matrix` (dendrite + its postgres) and profile `bot`
  # (mak-agent-bot) start only when asked: COMPOSE_PROFILES=matrix,bot in
  # .env for the full stack. Without them, `up` starts the data plane alone
  # (nginx, oxigraph, link-handler): a second Dendrite with the same server
  # name, or a second bot on the same access token, must never run next to
  # the live ones.
  # ─────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────
  # dendrite-postgres — DB for the self-hosted Matrix homeserver.
  # Postgres (not SQLite) per Dendrite's own guidance: SQLite is
  # single-writer and explicitly not recommended for federated deployments.
  # ─────────────────────────────────────────────────────────────────
  dendrite-postgres:
    image: postgres:16.14-alpine
    container_name: maps-dendrite-postgres
    restart: unless-stopped
    profiles: [matrix]
    mem_limit: 256m
    networks:
      - internal
    environment:
      - POSTGRES_USER=dendrite
      # `:-`, not `:?`: compose checks `:?` even when the `matrix` profile is
      # off. Unset, the postgres image refuses to initialise an empty database.
      - POSTGRES_PASSWORD=${DENDRITE_DB_PASSWORD:-}
      - POSTGRES_DATABASE=dendrite
      - PGDATA=/var/lib/postgresql/data/pgdata   # avoid initdb choking on .gitkeep at the mount root
    volumes:
      - ../data/dendrite-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dendrite -d dendrite"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  # dendrite — self-hosted Matrix homeserver for @bernard:mapsofmaking.org.
  # Federated (not isolated): bots are ordinary Matrix accounts, so a
  # federated homeserver lets the bot be invited into rooms on any
  # federation-friendly server (matrix.org included) without redeploying
  # it elsewhere. server_name "mapsofmaking.org" set at config-generation
  # time (infra/dendrite/config/dendrite.yaml, gitignored — contains the
  # signing key + DB password + registration_shared_secret).
  # Joins `gateway` for federation (inbound :8448) + client API; nginx
  # proxies/well-known delegation is a deploy-time step (see Dev Notes).
  # ─────────────────────────────────────────────────────────────────
  dendrite:
    image: ghcr.io/element-hq/dendrite-monolith:v0.15.2
    container_name: maps-dendrite
    restart: unless-stopped
    profiles: [matrix]
    mem_limit: 256m
    networks:
      - gateway
      - internal
    volumes:
      - ./dendrite/config:/etc/dendrite
      - ../data/dendrite-media:/var/dendrite/media
    command: --config /etc/dendrite/dendrite.yaml
    expose:
      - "8008"
    depends_on:
      dendrite-postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # mak-agent-bot — "Ask Bernard" channel-agnostic bot spine (Epic 6).
  # ADR-017: folded into harness/ as a service in this compose project
  # (no separate Nanobot project). Long-running Matrix sync-loop client,
  # not an HTTP server — no port to expose.
  # ─────────────────────────────────────────────────────────────────
  mak-agent-bot:
    build: ../harness
    image: ghcr.io/mapsofmaking/maps-agent-bot:${MAP_TAG:-local}
    container_name: maps-agent-bot
    restart: unless-stopped
    profiles: [bot]
    mem_limit: 128m
    networks:
      - internal
    volumes:
      # infra/bot/ is the bot-write code (Story 6.1); schema.py/bot_keys.py are
      # link_handler's canonical copies, mounted alongside so there's exactly
      # one SpaceAPISchema and one key-storage format shared by both containers.
      - ./bot:/app/bot:ro
      - ./link_handler/schema.py:/app/bot/schema.py:ro
      - ./link_handler/bot_keys.py:/app/bot/bot_keys.py:ro
      - ../data/bot-keys:/app/bot-keys:ro
      - ../data/bot-repos:/app/bot-repos
      # capability_gaps.db / fuzzy_questions.db — was unmounted (ephemeral
      # container fs), so every redeploy silently wiped all logged gaps.
      - ../data/bot-tasks:/app/tasks
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OXIGRAPH_ENDPOINT=http://oxigraph:7878
      - BERNARD_MATRIX_HOMESERVER=${BERNARD_MATRIX_HOMESERVER}
      - BERNARD_MATRIX_USER_ID=${BERNARD_MATRIX_USER_ID}
      - BERNARD_MATRIX_ACCESS_TOKEN=${BERNARD_MATRIX_ACCESS_TOKEN}
      - BERNARD_MATRIX_DEVICE_ID=${BERNARD_MATRIX_DEVICE_ID}
      - LINK_HANDLER_URL=http://mak-link-handler:8000
      - BOT_KEY_SECRET=${BOT_KEY_SECRET:?BOT_KEY_SECRET must be set in .env}
      - BOT_KEYS_DIR=/app/bot-keys
      - BOT_REPOS_DIR=/app/bot-repos
      - ORS_API_KEY=${ORS_API_KEY}
    depends_on:
      oxigraph:
        condition: service_started
      # Not required: Dendrite may run elsewhere (the bot reaches it at
      # BERNARD_MATRIX_HOMESERVER, a URL), or in this project's `matrix` profile.
      dendrite:
        condition: service_started
        required: false

  # ─────────────────────────────────────────────────────────────────
  # mak-link-handler — FastAPI magic link validator & claim handler
  # Processes /claim/{token} requests (full impl in Epic 3 Story 3.3).
  # ─────────────────────────────────────────────────────────────────
  mak-link-handler:
    build: ./link_handler
    image: ghcr.io/mapsofmaking/maps-link-handler:${MAP_TAG:-local}
    container_name: maps-link-handler
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - internal
    expose:
      - "8000"
    volumes:
      - ../web/data:/app/web_data
      - ../scripts/activity_map.yaml:/app/scripts/activity_map.yaml:ro
      - ../scripts/spaceapi_extract:/app/scripts/spaceapi_extract:ro
      - ../data/tasks:/app/tasks    # persist heartbeat_log.db across restarts
      - ../data/bot-keys:/app/bot-keys    # deploy keys (Story 6.1) — read/write, this is the only generator
    environment:
      - OXIGRAPH_ENDPOINT=http://oxigraph:7878
      - LINK_SECRET=${LINK_SECRET:?LINK_SECRET must be set in .env}
      - GEOJSON_OUTPUT=/app/web_data/spaces.geojson
      - SCRIPTS_DIR=/app/scripts
      - BOT_KEY_SECRET=${BOT_KEY_SECRET:?BOT_KEY_SECRET must be set in .env}
      - BOT_KEYS_DIR=/app/bot-keys
    depends_on:
      oxigraph:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  gateway:
    external: true        # shared with the host's gateway (hetzner-gateway, or Caddy on MoM)
    name: ${GATEWAY_NETWORK:-gateway}   # MoM: GATEWAY_NETWORK=proxy in .env
  internal:
    driver: bridge        # maps-web ↔ oxigraph, mak-agent-bot, mak-link-handler
