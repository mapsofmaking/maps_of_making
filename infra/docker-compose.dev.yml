# Local dev overrides — NOT for VPS deployment
# Usage: podman compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Isolation note: On Fedora/distrobox, hetzner-gateway network doesn't exist locally.
# This override removes the gateway network dependency and exposes ports directly.
# On VPS (Ubuntu), use docker-compose.yml alone — gateway handles routing.

services:
  maps-web:
    networks:
      - internal    # drop gateway network (doesn't exist locally)
    ports:
      - "8080:80"
    volumes:
      # Live web/ and Caddyfile: edits show without a rebuild (restart for the Caddyfile).
      - ../web:/srv:ro,z
      - ../web/data:/srv/data:ro,z
      - ../web/canary:/srv/canary:ro,z
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ../ontology:/ns:ro,z
    environment:
      # Local only: admin / devadmin.
      - MAP_ADMIN_PASSWORD_HASH=$$2a$$14$$l26hqpGHYHgPrXnLjySlquUViWGhKG3G4WYL2d0zlZpijAGkR5Fpa

  mak-link-handler:
    volumes:
      - ../web/data:/app/web_data:z
      - ../scripts:/app/scripts:ro,z  # full scripts dir — edits propagate without rebuild
      - ../web/canary:/app/web/canary:ro,z  # served canary JSON for load_canary CANARY_FILE
      - ../data/tasks:/app/tasks:z  # persist heartbeat_log.db; :z for Fedora SELinux
      - ../data/canary:/app/data/canary:ro,z  # for Mother Sands canary diagnostic endpoint
      - ../data/bot-keys:/app/bot-keys:z  # deploy keys (Story 6.1); :z for Fedora SELinux
    environment:
      - SCRIPTS_DIR=/app/scripts

  mak-agent-bot:
    volumes:
      - ./bot:/app/bot:ro,z
      - ./link_handler/schema.py:/app/bot/schema.py:ro,z
      - ./link_handler/bot_keys.py:/app/bot/bot_keys.py:ro,z
      - ../data/bot-keys:/app/bot-keys:ro,z
      - ../data/bot-repos:/app/bot-repos:z

  oxigraph:
    ports:
      - "7878:7878"
    volumes:
      - ../data/oxigraph:/data:z

  dendrite:
    ports:
      - "8008:8008"   # client API reachable for a local Matrix client / curl, federation untested locally
    volumes:
      - ./dendrite/config:/etc/dendrite:z
      - ../data/dendrite-media:/var/dendrite/media:z

  dendrite-postgres:
    volumes:
      - ../data/dendrite-postgres:/var/lib/postgresql/data:z

networks:
  gateway:
    external: false   # override: create locally instead of requiring hetzner-gateway
