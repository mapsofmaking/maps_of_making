# Mac/Docker local dev override
# Usage: make mac-up (spins up MoM stack + OHM)
#        make mac-down
#        make mac-init  (load ontologies, seed test data, trigger heartbeat)
#
# Differences from docker-compose.dev.yml (Fedora/Podman):
#   - Strips SELinux :z volume flags (not applicable on macOS)
#   - Uses docker compose (not podman compose)
#   - Skips dendrite, dendrite-postgres, mak-agent-bot (no config available locally)
#   - Adds OHM (Open Hardware Manager) for integration testing

services:
  maps-web:
    networks:
      - internal    # drop gateway network (doesn't exist locally)
    ports:
      - "8080:80"
    volumes:
      # Live web/ and Caddyfile: edits show without a rebuild (restart for the Caddyfile).
      - ../web:/srv:ro
      - ../web/data:/srv/data:ro
      - ../web/canary:/srv/canary:ro
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      # Local only: admin / devadmin.
      - MAP_ADMIN_PASSWORD_HASH=$$2a$$14$$l26hqpGHYHgPrXnLjySlquUViWGhKG3G4WYL2d0zlZpijAGkR5Fpa

  mak-link-handler:
    volumes:
      - ../web/data:/app/web_data
      - ../scripts:/app/scripts:ro
      - ../web/canary:/app/web/canary:ro
      - ../data/tasks:/app/tasks
      - ../data/canary:/app/data/canary:ro
      - ../data/bot-keys:/app/bot-keys
    environment:
      - SCRIPTS_DIR=/app/scripts

  oxigraph:
    ports:
      - "7878:7878"
    volumes:
      - ../data/oxigraph:/data

  ohm:
    image: touchthesun/openhardwaremanager:0.8.5
    container_name: maps-ohm
    command: api
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - API_PORT=8001
      - LOG_LEVEL=warning
    volumes:
      - ../data/ohm:/app/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  gateway:
    external: false
